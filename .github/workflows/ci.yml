name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Build
        run: cargo build --workspace --verbose

      - name: Run unit tests
        run: cargo test --workspace --verbose -- --skip live_

      - name: Verify resource schema is up to date
        run: |
          cargo xtask generate resource-schema --pretty --file=./ui/public/schema/resources.json
          git diff --exit-code ./ui/public/schema/resources.json

  fmt:
    name: Format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  ui:
    name: UI Test & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable Corepack
        run: corepack enable

      - name: Build TypeScript client
        run: |
          yarn --cwd ./client/core/ts install --frozen-lockfile
          yarn --cwd ./client/core/ts build
          (cd ./client/core/ts && yarn link)

      - name: Install, test, and build UI
        run: |
          yarn --cwd ./ui install --frozen-lockfile
          (cd ./ui && yarn link komodo_client)
          yarn --cwd ./ui test
          yarn --cwd ./ui build
